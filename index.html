<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV 안심 귀갓길 내비게이션</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .mobile-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 430px;
            max-height: 932px;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        @media (min-width: 431px) {
            .mobile-container {
                height: 92vh;
                border-radius: 32px;
                border: 8px solid #334155;
            }
        }

        .tab-content {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100% - 64px);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .tab-content.active {
            display: flex;
        }

        /* 검색 패널 */
        .search-panel {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        .search-box {
            display: flex;
            gap: 8px;
        }
        .search-input {
            flex: 1;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            color: #0f172a;
        }
        .search-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #e2e8f0;
        }

        .map-bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: #ffffff;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
        }
        .info-txt {
            font-size: 12px;
            color: #475569;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .go-navi-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }

        /* 탭 2: 내비게이션 */
        .navi-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #0f172a;
            color: white;
            overflow-y: auto;
        }
        .navi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .navi-status-pill {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #4ade80;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .turn-card {
            background: #16a34a;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.3);
        }
        .turn-icon {
            font-size: 42px;
            background: rgba(255, 255, 255, 0.2);
            width: 68px;
            height: 68px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .turn-info h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .turn-info p {
            font-size: 12px;
            color: #dcfce7;
            font-weight: 500;
        }
        .navi-progress-card {
            background: #1e293b;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #334155;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar-fill {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            border-radius: 10px;
        }
        .cctv-shield-box {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }
        .sim-controls {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sos-wide-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: #ef4444;
            color: white;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .bottom-nav {
            height: 64px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            z-index: 30;
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .nav-item.active {
            color: #16a34a;
        }
        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="mobile-container">

    <!-- 탭 1: 안전 지도 & 목적지 검색 -->
    <div id="tab-map" class="tab-content active">
        <div class="search-panel">
            <div class="search-box">
                <input type="text" id="dest-input" class="search-input" placeholder="도착할 목적지 입력 (예: 가림고등학교)">
                <button class="search-btn" onclick="searchDestination()">검색</button>
            </div>
        </div>

        <div id="map"></div>

        <div class="map-bottom-sheet">
            <div class="info-txt" id="route-info-txt">📍 목적지를 검색하면 주변 방범 CCTV망과 안심 보행로가 표시됩니다.</div>
            <button class="go-navi-btn" onclick="switchTab('navi')">안심 내비게이션 시작 →</button>
        </div>
    </div>

    <!-- 탭 2: 안심 내비게이션 -->
    <div id="tab-navi" class="tab-content">
        <div class="navi-container">
            <div class="navi-header">
                <span style="font-size: 15px; font-weight: 800;">🧭 실시간 안심 안내</span>
                <div class="navi-status-pill">CCTV 보안망 연동됨</div>
            </div>

            <div class="turn-card">
                <div class="turn-icon" id="navi-arrow">🛡️</div>
                <div class="turn-info">
                    <h2 id="navi-dist">목적지 안내 대기 중</h2>
                    <p id="navi-street">상단 탭에서 목적지를 먼저 검색해 주세요</p>
                </div>
            </div>

            <div class="navi-progress-card">
                <div class="progress-header">
                    <span>귀가 진행 상황</span>
                    <span id="navi-remain" style="color: #4ade80; font-weight: 700;">안전 구역 대기</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="navi-bar" style="width: 0%;"></div>
                </div>
                <div class="cctv-shield-box">
                    <span style="font-size: 22px;">📹</span>
                    <div>
                        <h4 id="current-cctv-info" style="color: #60a5fa; font-weight: 700; margin-bottom: 2px;">지능형 방범 CCTV 연계 대기</h4>
                        <p style="color: #cbd5e1;">목적지 설정 시 주변 CCTV 실시간 매칭</p>
                    </div>
                </div>
            </div>

            <div class="sim-controls">
                <button class="sos-wide-btn" onclick="triggerSOS()">🚨 긴급 SOS (위치 및 CCTV 전송)</button>
            </div>
        </div>
    </div>

    <!-- 하단 탭 네비게이션 -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-btn-map" onclick="switchTab('map')">
            <span class="nav-icon">🗺️</span>
            <span>안전 지도</span>
        </button>
        <button class="nav-item" id="nav-btn-navi" onclick="switchTab('navi')">
            <span class="nav-icon">🧭</span>
            <span>안심 내비</span>
        </button>
    </nav>

</div>

<!-- libraries=services를 추가하여 장소 검색(Places) 기능 활성화 -->
<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f2ffa998b7bd87d0bcf43d45a823a96&libraries=services&autoload=false"></script>

<script>
    let map = null;
    let ps = null;
    let currentPolyline = null;
    let userMarker = null;
    let destMarker = null;
    let cctvOverlays = [];

    let currentLat = 37.4562; // 기본 내 위치 (인천 인근)
    let currentLng = 126.7052;

    window.addEventListener('load', function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    initMap(currentLat, currentLng);
                },
                function(error) {
                    initMap(currentLat, currentLng);
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        } else {
            initMap(currentLat, currentLng);
        }
    });

    function initMap(lat, lng) {
        if (typeof kakao === 'undefined' || !kakao.maps) return;

        kakao.maps.load(function() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(lat, lng),
                level: 4
            };
            map = new kakao.maps.Map(container, options);

            // 장소 검색 객체 생성
            ps = new kakao.maps.services.Places();

            // 내 위치 마커 표시
            userMarker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(lat, lng),
                title: '내 위치'
            });
        });
    }

    // 목적지 검색 함수
    function searchDestination() {
        const keyword = document.getElementById('dest-input').value.trim();
        if (!keyword) {
            alert("검색할 목적지 이름을 입력해주세요!");
            return;
        }

        ps.keywordSearch(keyword, function(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                const destLat = data[0].y;
                const destLng = data[0].x;
                const destName = data[0].place_name;

                setDestinationOnMap(parseFloat(destLat), parseFloat(destLng), destName);
            } else {
                alert("검색 결과가 없습니다. 다른 이름으로 검색해 보세요.");
            }
        });
    }

    // 검색된 목적지를 지도에 반영하고 안전 경로 및 CCTV 표시
    function setDestinationOnMap(destLat, destLng, destName) {
        if (destMarker) destMarker.setMap(null);
        if (currentPolyline) currentPolyline.setMap(null);
        cctvOverlays.forEach(o => o.setMap(null));
        cctvOverlays = [];

        const destPosition = new kakao.maps.LatLng(destLat, destLng);
        const startPosition = new kakao.maps.LatLng(currentLat, currentLng);

        // 목적지 마커 생성
        destMarker = new kakao.maps.Marker({
            map: map,
            position: destPosition,
            title: destName
        });

        // 지도 범위를 내 위치와 목적지가 모두 보이도록 조절
        const bounds = new kakao.maps.LatLngBounds();
        bounds.extend(startPosition);
        bounds.extend(destPosition);
        map.setBounds(bounds);

        // 내 위치와 목적지 사이를 자연스럽게 잇는 안전 보행로 선형 생성 (직선이 아닌 코너 경유)
        const midLat = (currentLat + destLat) / 2 + 0.001;
        const midLng = (currentLng + destLng) / 2 - 0.001;

        const path = [
            startPosition,
            new kakao.maps.LatLng(midLat, midLng),
            destPosition
        ];

        currentPolyline = new kakao.maps.Polyline({
            path: path,
            strokeWeight: 7,
            strokeColor: '#16a34a',
            strokeOpacity: 0.9,
            strokeStyle: 'solid'
        });
        currentPolyline.setMap(map);

        // 중간 경유지에 방범용 CCTV 및 안심벨 구역 자동 배치
        const cctvPos = new kakao.maps.LatLng(midLat, midLng);
        const circle = new kakao.maps.Circle({
            center: cctvPos,
            radius: 60,
            strokeWeight: 1,
            strokeColor: '#16a34a',
            strokeOpacity: 0.8,
            fillColor: '#22c55e',
            fillOpacity: 0.25
        });
        circle.setMap(map);
        cctvOverlays.push(circle);

        const content = `<div style="background:#15803d; color:white; font-size:10px; font-weight:bold; padding:3px 7px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.3);">📹 안심CCTV존</div>`;
        const customOverlay = new kakao.maps.CustomOverlay({ map: map, position: cctvPos, content: content, yAnchor: 1.5 });
        cctvOverlays.push(customOverlay);

        // 하단 안내 문구 및 내비게이션 탭 내용 업데이트
        document.getElementById('route-info-txt').innerHTML = `✅ <b>${destName}</b>까지의 안심 보행로 (CCTV 1개소 경유)`;
        document.getElementById('navi-arrow').innerText = "⬆️";
        document.getElementById('navi-dist').innerText = `${destName} 방면 직진`;
        document.getElementById('navi-street').innerText = "방범용 CCTV 감시 반경 내 이동 중";
        document.getElementById('navi-remain').innerText = "안전 구역 통과 중";
        document.getElementById('navi-bar').style.width = "40%";
        document.getElementById('current-cctv-info').innerText = "실시간 방범 CCTV 연계 및 보안등 작동 중";
    }

    function switchTab(tabName) {
        document.getElementById('tab-map').classList.remove('active');
        document.getElementById('tab-navi').classList.remove('active');
        document.getElementById('nav-btn-map').classList.remove('active');
        document.getElementById('nav-btn-navi').classList.remove('active');

        document.getElementById('tab-' + tabName).classList.add('active');
        document.getElementById('nav-btn-' + tabName).classList.add('active');

        if (tabName === 'map' && map) {
            setTimeout(() => {
                map.relayout();
            }, 100);
        }
    }

    function triggerSOS() {
        alert("🚨 [긴급 SOS 발동]\n현재 GPS 좌표와 인근 방범 CCTV 정보가 112 상황실 및 보호자에게 전송되었습니다.");
    }
</script>

</body>
</html>

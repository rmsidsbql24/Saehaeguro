<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV 안심 귀갓길 내비게이션</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .mobile-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 430px;
            max-height: 932px;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        @media (min-width: 431px) {
            .mobile-container {
                height: 92vh;
                border-radius: 32px;
                border: 8px solid #334155;
            }
        }

        .tab-content {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100% - 64px);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .tab-content.active {
            display: flex;
        }

        /* 탭 1: 안전 지도 */
        .top-panel {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }
        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .header-title h1 {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
        }
        .badge {
            font-size: 10px;
            background: #dcfce7;
            color: #15803d;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 700;
        }
        .alert-banner {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #1e40af;
            font-weight: 600;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #e2e8f0;
        }

        .map-bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: #ffffff;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
        }
        .route-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .toggle-btn {
            flex: 1;
            padding: 9px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            background: #fff;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
        }
        .toggle-btn.active.safe {
            border-color: #16a34a;
            background: #f0fdf4;
            color: #15803d;
        }
        .toggle-btn.active.short {
            border-color: #ef4444;
            background: #fef2f2;
            color: #b91c1c;
        }
        .go-navi-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }

        /* 탭 2: 내비게이션 */
        .navi-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #0f172a;
            color: white;
            overflow-y: auto;
        }
        .navi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .navi-status-pill {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #4ade80;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .turn-card {
            background: #16a34a;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.3);
        }
        .turn-icon {
            font-size: 42px;
            background: rgba(255, 255, 255, 0.2);
            width: 68px;
            height: 68px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .turn-info h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .turn-info p {
            font-size: 12px;
            color: #dcfce7;
            font-weight: 500;
        }
        .navi-progress-card {
            background: #1e293b;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #334155;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar-fill {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            border-radius: 10px;
        }
        .cctv-shield-box {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }
        .sim-controls {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sim-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: #3b82f6;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .sos-wide-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: #ef4444;
            color: white;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        /* 하단 탭 바 */
        .bottom-nav {
            height: 64px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            z-index: 30;
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .nav-item.active {
            color: #16a34a;
        }
        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="mobile-container">

    <!-- 탭 1: 안전 지도 -->
    <div id="tab-map" class="tab-content active">
        <div class="top-panel">
            <div class="header-title">
                <h1>🛡️ 실시간 안심 귀갓길</h1>
                <span class="badge">GPS 자동동기화</span>
            </div>
            <div class="alert-banner">
                <span>📍</span>
                <span id="location-status">현재 GPS 위치를 불러오는 중입니다...</span>
            </div>
        </div>

        <div id="map"></div>

        <div class="map-bottom-sheet">
            <div class="route-toggle">
                <button class="toggle-btn active safe" id="btn-safe" onclick="selectRoute('safe')">
                    🛡️ CCTV 안심 보행로
                </button>
                <button class="toggle-btn short" id="btn-short" onclick="selectRoute('short')">
                    ⚡ 최단 거리 골목
                </button>
            </div>
            <button class="go-navi-btn" onclick="switchTab('navi')">안심 내비게이션 시작 →</button>
        </div>
    </div>

    <!-- 탭 2: 안심 내비게이션 -->
    <div id="tab-navi" class="tab-content">
        <div class="navi-container">
            <div class="navi-header">
                <span style="font-size: 15px; font-weight: 800;">🧭 실시간 안심 안내</span>
                <div class="navi-status-pill">CCTV 보안망 연동됨</div>
            </div>

            <div class="turn-card">
                <div class="turn-icon" id="navi-arrow">⬆️</div>
                <div class="turn-info">
                    <h2 id="navi-dist">현재 위치에서 직진</h2>
                    <p id="navi-street">방범용 CCTV 감시 반경 내 이동 중</p>
                </div>
            </div>

            <div class="navi-progress-card">
                <div class="progress-header">
                    <span>귀가 진행 상황</span>
                    <span id="navi-remain" style="color: #4ade80; font-weight: 700;">안전 구역 통과 중</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="navi-bar"></div>
                </div>
                <div class="cctv-shield-box">
                    <span style="font-size: 22px;">📹</span>
                    <div>
                        <h4 id="current-cctv-info" style="color: #60a5fa; font-weight: 700; margin-bottom: 2px;">인근 CCTV 자동 탐색 중</h4>
                        <p style="color: #cbd5e1;">실시간 보안등 및 안심벨 구역 매칭 완료</p>
                    </div>
                </div>
            </div>

            <div class="sim-controls">
                <button class="sim-btn" onclick="nextNavigationStep()">👣 안내 구간 다음 단계로 이동</button>
                <button class="sos-wide-btn" onclick="triggerSOS()">🚨 긴급 SOS (위치 및 CCTV 전송)</button>
            </div>
        </div>
    </div>

    <!-- 하단 탭 네비게이션 -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-btn-map" onclick="switchTab('map')">
            <span class="nav-icon">🗺️</span>
            <span>안전 지도</span>
        </button>
        <button class="nav-item" id="nav-btn-navi" onclick="switchTab('navi')">
            <span class="nav-icon">🧭</span>
            <span>안심 내비</span>
        </button>
    </nav>

</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f2ffa998b7bd87d0bcf43d45a823a96&autoload=false"></script>

<script>
    let map = null;
    let currentPolyline = null;
    let userMarker = null;
    let currentRouteType = 'safe';
    let naviStep = 0;

    // 기본 위치 (GPS 허용 전 임시 좌표 - 서울/인천 중심)
    let currentLat = 37.5665;
    let currentLng = 126.9780;

    window.addEventListener('load', function() {
        // 브라우저 GPS 위치 실시간 요청
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    document.getElementById('location-status').innerText = "현재 위치(GPS) 동기화 완료";
                    initMapAndRoute(currentLat, currentLng);
                },
                function(error) {
                    document.getElementById('location-status').innerText = "GPS 권한 거부됨 (기본 시연 위치 적용)";
                    initMapAndRoute(currentLat, currentLng);
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        } else {
            initMapAndRoute(currentLat, currentLng);
        }
    });

    function initMapAndRoute(lat, lng) {
        if (typeof kakao === 'undefined' || !kakao.maps) return;

        kakao.maps.load(function() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(lat, lng),
                level: 3
            };
            map = new kakao.maps.Map(container, options);

            // 현재 내 위치 마커 표시
            userMarker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(lat, lng),
                title: '내 위치'
            });

            // 내 위치 주변으로 안심 경로와 CCTV 가상 자동 생성
            generateDynamicRoute(lat, lng);
        });
    }

    // 현재 접속한 위치를 기준으로 주변 500m 내에 안심 경로와 CCTV를 자동으로 그려줌
    let safePath = [];
    let shortPath = [];
    let cctvList = [];

    function generateDynamicRoute(lat, lng) {
        // 현재 위치를 출발지로, 북동쪽 방향을 목적지로 자동 설정
        const destLat = lat + 0.005;
        const destLng = lng + 0.006;

        safePath = [
            new kakao.maps.LatLng(lat, lng),
            new kakao.maps.LatLng(lat + 0.0015, lng + 0.001),
            new kakao.maps.LatLng(lat + 0.003, lng + 0.003),
            new kakao.maps.LatLng(destLat, destLng)
        ];

        shortPath = [
            new kakao.maps.LatLng(lat, lng),
            new kakao.maps.LatLng(lat + 0.002, lng + 0.0015),
            new kakao.maps.LatLng(destLat, destLng)
        ];

        cctvList = [
            { pos: new kakao.maps.LatLng(lat + 0.0015, lng + 0.001), name: "CCTV #01 (대로변)" },
            { pos: new kakao.maps.LatLng(lat + 0.003, lng + 0.003), name: "CCTV #02 (안심존)" }
        ];

        // CCTV 감시 반경(원) 표시
        cctvList.forEach((cctv, idx) => {
            const circle = new kakao.maps.Circle({
                center: cctv.pos,
                radius: 60,
                strokeWeight: 1,
                strokeColor: '#16a34a',
                strokeOpacity: 0.8,
                fillColor: '#22c55e',
                fillOpacity: 0.25
            });
            circle.setMap(map);

            const content = `<div style="background:#15803d; color:white; font-size:10px; font-weight:bold; padding:2px 6px; border-radius:10px;">📹 CCTV</div>`;
            new kakao.maps.CustomOverlay({ map: map, position: cctv.pos, content: content, yAnchor: 1.5 });
        });

        drawRoute(currentRouteType);
    }

    function drawRoute(type) {
        if (!map) return;
        if (currentPolyline) currentPolyline.setMap(null);

        const path = type === 'safe' ? safePath : shortPath;
        currentPolyline = new kakao.maps.Polyline({
            path: path,
            strokeWeight: 7,
            strokeColor: type === 'safe' ? '#16a34a' : '#ef4444',
            strokeOpacity: 0.9,
            strokeStyle: type === 'safe' ? 'solid' : 'shortdash'
        });
        currentPolyline.setMap(map);
    }

    function selectRoute(type) {
        currentRouteType = type;
        const btnSafe = document.getElementById('btn-safe');
        const btnShort = document.getElementById('btn-short');
        if (type === 'safe') {
            btnSafe.classList.add('active');
            btnShort.classList.remove('active');
        } else {
            btnShort.classList.add('active');
            btnSafe.classList.remove('active');
        }
        drawRoute(type);
    }

    function switchTab(tabName) {
        document.getElementById('tab-map').classList.remove('active');
        document.getElementById('tab-navi').classList.remove('active');
        document.getElementById('nav-btn-map').classList.remove('active');
        document.getElementById('nav-btn-navi').classList.remove('active');

        document.getElementById('tab-' + tabName).classList.add('active');
        document.getElementById('nav-btn-' + tabName).classList.add('active');

        if (tabName === 'map' && map) {
            setTimeout(() => {
                map.relayout();
                map.setCenter(new kakao.maps.LatLng(currentLat, currentLng));
            }, 100);
        }
    }

    const NAVI_STEPS = [
        { arrow: "⬆️", dist: "현재 위치에서 정면 대로변 진입", street: "방범용 CCTV #01 감시 반경 내", remain: "남은 거리 약 400m", progress: "30%", cctv: "CCTV #01 연계 보안등 정상 작동 중" },
        { arrow: "↗️", dist: "150m 앞 사거리 우측 인도 통과", street: "안심벨 설치 구역 통과 중", remain: "남은 거리 약 200m", progress: "70%", cctv: "CCTV #02 연계 안심존 통과 중" },
        { arrow: "🏁", dist: "목적지 부근 도착 완료", street: "안전 귀가 완료 지점", remain: "도착 완료 (0m)", progress: "100%", cctv: "귀가 완료 상태 자동 기록" }
    ];

    function nextNavigationStep() {
        naviStep = (naviStep + 1) % NAVI_STEPS.length;
        const data = NAVI_STEPS[naviStep];
        document.getElementById('navi-arrow').innerText = data.arrow;
        document.getElementById('navi-dist').innerText = data.dist;
        document.getElementById('navi-street').innerText = data.street;
        document.getElementById('navi-remain').innerText = data.remain;
        document.getElementById('navi-bar').style.width = data.progress;
        document.getElementById('current-cctv-info').innerText = data.cctv;
    }

    function triggerSOS() {
        alert("🚨 [긴급 SOS 발동]\n현재 GPS 좌표와 인근 방범 CCTV 정보가 112 상황실 및 보호자에게 전송되었습니다.");
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV 안심 귀갓길 내비게이션</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        /* 모바일 디바이스 최적화 프레임 */
        .mobile-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 430px;
            max-height: 932px;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        @media (min-width: 431px) {
            .mobile-container {
                height: 92vh;
                border-radius: 32px;
                border: 8px solid #334155;
            }
        }

        /* 탭 콘텐츠 영역 */
        .tab-content {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100% - 64px);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .tab-content.active {
            display: flex;
        }

        /* ================= [탭 1: 안전 지도 & 문제상황] ================= */
        .top-panel {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }
        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .header-title h1 {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
        }
        .badge {
            font-size: 10px;
            background: #dcfce7;
            color: #15803d;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 700;
        }
        .alert-banner {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            color: #b91c1c;
            font-weight: 600;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #e2e8f0;
        }

        /* 지도 하단 시트 */
        .map-bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: #ffffff;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
        }
        .route-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .toggle-btn {
            flex: 1;
            padding: 9px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            background: #fff;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
        }
        .toggle-btn.active.safe {
            border-color: #16a34a;
            background: #f0fdf4;
            color: #15803d;
        }
        .toggle-btn.active.short {
            border-color: #ef4444;
            background: #fef2f2;
            color: #b91c1c;
        }
        .issue-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .issue-item {
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 11.5px;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .issue-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .tag-warn { background: #fee2e2; color: #dc2626; }
        .tag-safe { background: #dcfce7; color: #16a34a; }

        .go-navi-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }

        /* ================= [탭 2: 턴바이턴 안심 내비게이션] ================= */
        .navi-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #0f172a;
            color: white;
            overflow-y: auto;
        }
        .navi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .navi-status-pill {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #4ade80;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            70% { transform: scale(1.4); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        /* 다음 방향 안내 대형 카드 */
        .turn-card {
            background: #16a34a;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.3);
        }
        .turn-icon {
            font-size: 42px;
            background: rgba(255, 255, 255, 0.2);
            width: 68px;
            height: 68px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .turn-info h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .turn-info p {
            font-size: 13px;
            color: #dcfce7;
            font-weight: 500;
        }

        /* 미니 지도 & 진행률 카드 */
        .navi-progress-card {
            background: #1e293b;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #334155;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar-fill {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .cctv-shield-box {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cctv-shield-box div h4 {
            font-size: 13px;
            color: #60a5fa;
            margin-bottom: 2px;
        }
        .cctv-shield-box div p {
            font-size: 11px;
            color: #cbd5e1;
        }

        /* 시연용 단계 이동 컨트롤러 */
        .sim-controls {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sim-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: #3b82f6;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .sos-wide-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: #ef4444;
            color: white;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        /* ================= [하단 고정 탭 바] ================= */
        .bottom-nav {
            height: 64px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            z-index: 30;
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .nav-item.active {
            color: #16a34a;
        }
        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="mobile-container">

    <!-- ================= 탭 1: 안전 지도 & CCTV/문제상황 ================= -->
    <div id="tab-map" class="tab-content active">
        <div class="top-panel">
            <div class="header-title">
                <h1>🛡️ CCTV 안심 귀갓길</h1>
                <span class="badge">실시간 관제중</span>
            </div>
            <div class="alert-banner">
                <span>⚠️</span>
                <span>주의: 중앙골목 가로등 고장 및 CCTV 사각지대 감지 (우회 권장)</span>
            </div>
        </div>

        <!-- 카카오 지도 영역 -->
        <div id="map"></div>

        <!-- 하단 요약 및 경로 비교 시트 -->
        <div class="map-bottom-sheet">
            <div class="route-toggle">
                <button class="toggle-btn active safe" id="btn-safe" onclick="selectRoute('safe')">
                    🛡️ CCTV 안심 경로 (14분)
                </button>
                <button class="toggle-btn short" id="btn-short" onclick="selectRoute('short')">
                    ⚡ 최단 골목 경로 (위험)
                </button>
            </div>

            <div class="issue-list">
                <div class="issue-item">
                    <span>📹 경로 내 방범용 CCTV 5대 감시중</span>
                    <span class="issue-tag tag-safe">안전</span>
                </div>
                <div class="issue-item">
                    <span>🚨 후문 샛길 어두운 골목 (사각지대)</span>
                    <span class="issue-tag tag-warn">우회완료</span>
                </div>
            </div>

            <button class="go-navi-btn" onclick="switchTab('navi')">안심 내비게이션 안내 시작 →</button>
        </div>
    </div>

    <!-- ================= 탭 2: 안심 귀가 내비게이션 ================= -->
    <div id="tab-navi" class="tab-content">
        <div class="navi-container">
            <div class="navi-header">
                <span style="font-size: 15px; font-weight: 800;">🧭 안심 귀가 안내</span>
                <div class="navi-status-pill">
                    <span class="pulse-dot"></span>
                    <span>CCTV 보호구역 내 이동중</span>
                </div>
            </div>

            <!-- 다음 방향 대형 안내 -->
            <div class="turn-card">
                <div class="turn-icon" id="navi-arrow">⬆️</div>
                <div class="turn-info">
                    <h2 id="navi-dist">180m 앞 직진</h2>
                    <p id="navi-street">대로변 안심벨 2번 구역 방면</p>
                </div>
            </div>

            <!-- 진행 상황 & CCTV 보호 상태 -->
            <div class="navi-progress-card">
                <div class="progress-header">
                    <span>출발: 학교 정문</span>
                    <span id="navi-remain" style="color: #4ade80; font-weight: 700;">남은 시간 10분 (620m)</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="navi-bar"></div>
                </div>
                <div class="cctv-shield-box">
                    <span style="font-size: 24px;">📹</span>
                    <div>
                        <h4 id="current-cctv-name">방범 CCTV #02 감시 반경 내 (반경 65m)</h4>
                        <p>이탈 시 보호자 앱으로 즉시 위치가 전송됩니다.</p>
                    </div>
                </div>
            </div>

            <!-- 하단 시연 컨트롤러 -->
            <div class="sim-controls">
                <button class="sim-btn" onclick="nextNavigationStep()">👣 다음 구간 이동 시뮬레이션 (시연용)</button>
                <button class="sos-wide-btn" onclick="triggerSOS()">🚨 긴급 SOS 신고 (112 및 보호자 위치전송)</button>
            </div>
        </div>
    </div>

    <!-- ================= 하단 2단 탭 전환 바 ================= -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-btn-map" onclick="switchTab('map')">
            <span class="nav-icon">🗺️</span>
            <span>안전 지도 · 현황</span>
        </button>
        <button class="nav-item" id="nav-btn-navi" onclick="switchTab('navi')">
            <span class="nav-icon">🧭</span>
            <span>안심 내비게이션</span>
        </button>
    </nav>

</div>

<!-- 카카오 맵 API SDK (HTTPS 명시) -->
<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7f2ffa998b7bd87d0bcf43d45a823a96&autoload=false"></script>

<script>
    let map = null;
    let currentPolyline = null;
    let naviStep = 0;

    // 시연용 좌표 데이터
    const START_POS = { lat: 37.4562557, lng: 126.7052062 };
    const END_POS   = { lat: 37.4615000, lng: 126.7115000 };

    const CCTV_LOCATIONS = [
        { lat: 37.4565, lng: 126.7065 },
        { lat: 37.4572, lng: 126.7082 },
        { lat: 37.4585, lng: 126.7098 },
        { lat: 37.4601, lng: 126.7108 },
        { lat: 37.4612, lng: 126.7112 }
    ];

    const SAFE_ROUTE_COORDS = [
        { lat: 37.4562557, lng: 126.7052062 },
        { lat: 37.4565, lng: 126.7065 },
        { lat: 37.4572, lng: 126.7082 },
        { lat: 37.4585, lng: 126.7098 },
        { lat: 37.4601, lng: 126.7108 },
        { lat: 37.4615000, lng: 126.7115000 }
    ];

    const SHORT_ROUTE_COORDS = [
        { lat: 37.4562557, lng: 126.7052062 },
        { lat: 37.4590, lng: 126.7075 },
        { lat: 37.4615000, lng: 126.7115000 }
    ];

    // 내비게이션 시연 단계 데이터
    const NAVI_STEPS = [
        { arrow: "⬆️", dist: "180m 앞 직진", street: "대로변 안심벨 2번 구역 방면", remain: "남은 시간 10분 (620m)", progress: "35%", cctv: "방범 CCTV #02 감시 반경 내 (반경 65m)" },
        { arrow: "↗️", dist: "120m 앞 우회전", street: "편의점 안심지킴이집 앞 횡단보도", remain: "남은 시간 6분 (380m)", progress: "65%", cctv: "방범 CCTV #03 감시 반경 내 (반경 65m)" },
        { arrow: "⬆️", dist: "80m 앞 직진", street: "공원 입구 비상벨 안심구역", remain: "남은 시간 2분 (120m)", progress: "90%", cctv: "방범 CCTV #04 감시 반경 내 (반경 65m)" },
        { arrow: "🏁", dist: "목적지 도착 완료!", street: "안전하게 자택 단지 입구에 도착했습니다", remain: "도착 완료 (0m)", progress: "100%", cctv: "방범 CCTV #05 최종 안전 확인 완료" }
    ];

    // 페이지 로드 시 카카오 맵 초기화
    window.addEventListener('load', function() {
        if (typeof kakao !== 'undefined' && kakao.maps) {
            kakao.maps.load(function() {
                initKakaoMap();
            });
        } else {
            document.getElementById('map').innerHTML = 
                '<div style="display:flex;justify-content:center;align-items:center;height:100%;padding:20px;text-align:center;color:#475569;font-size:13px;">카카오 지도를 불러오는 중입니다.<br>도메인(https://rmsidsbql24.github.io) 등록 상태를 확인해 주세요.</div>';
        }
    });

    function initKakaoMap() {
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.4588, 126.7083),
            level: 4
        };
        map = new kakao.maps.Map(container, options);

        // 출발, 도착 마커
        new kakao.maps.Marker({ map: map, position: new kakao.maps.LatLng(START_POS.lat, START_POS.lng) });
        new kakao.maps.Marker({ map: map, position: new kakao.maps.LatLng(END_POS.lat, END_POS.lng) });

        // 문제상황(위험 골목) 경고 마커 추가
        const dangerPos = new kakao.maps.LatLng(37.4590, 126.7075);
        const dangerOverlay = `<div style="background:#ef4444; color:white; font-size:10px; font-weight:bold; padding:3px 7px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.3);">⚠️ 가로등 고장/사각지대</div>`;
        new kakao.maps.CustomOverlay({ map: map, position: dangerPos, content: dangerOverlay, yAnchor: 1.2 });

        // CCTV 반경 및 라벨
        CCTV_LOCATIONS.forEach((cctv, idx) => {
            const pos = new kakao.maps.LatLng(cctv.lat, cctv.lng);
            const circle = new kakao.maps.Circle({
                center: pos,
                radius: 65,
                strokeWeight: 1,
                strokeColor: '#16a34a',
                strokeOpacity: 0.8,
                fillColor: '#22c55e',
                fillOpacity: 0.25
            });
            circle.setMap(map);

            const content = `<div style="background:#15803d; color:white; font-size:10px; font-weight:bold; padding:2px 6px; border-radius:10px;">📹 CCTV #0${idx+1}</div>`;
            new kakao.maps.CustomOverlay({ map: map, position: pos, content: content, yAnchor: 1.5 });
        });

        drawRoute('safe');
    }

    function drawRoute(type) {
        if (!map) return;
        if (currentPolyline) currentPolyline.setMap(null);

        const coords = type === 'safe' ? SAFE_ROUTE_COORDS : SHORT_ROUTE_COORDS;
        const linePath = coords.map(c => new kakao.maps.LatLng(c.lat, c.lng));

        currentPolyline = new kakao.maps.Polyline({
            path: linePath,
            strokeWeight: 7,
            strokeColor: type === 'safe' ? '#16a34a' : '#ef4444',
            strokeOpacity: 0.9,
            strokeStyle: type === 'safe' ? 'solid' : 'shortdash'
        });
        currentPolyline.setMap(map);
    }

    function selectRoute(type) {
        const btnSafe = document.getElementById('btn-safe');
        const btnShort = document.getElementById('btn-short');
        if (type === 'safe') {
            btnSafe.classList.add('active');
            btnShort.classList.remove('active');
        } else {
            btnShort.classList.add('active');
            btnSafe.classList.remove('active');
        }
        drawRoute(type);
    }

    // 탭 전환 함수
    function switchTab(tabName) {
        document.getElementById('tab-map').classList.remove('active');
        document.getElementById('tab-navi').classList.remove('active');
        document.getElementById('nav-btn-map').classList.remove('active');
        document.getElementById('nav-btn-navi').classList.remove('active');

        document.getElementById('tab-' + tabName).classList.add('active');
        document.getElementById('nav-btn-' + tabName).classList.add('active');

        // 지도 탭으로 돌아올 때 카카오 맵 크기 재계산 (깨짐 방지)
        if (tabName === 'map' && map) {
            setTimeout(() => {
                map.relayout();
                map.setCenter(new kakao.maps.LatLng(37.4588, 126.7083));
            }, 100);
        }
    }

    // 내비게이션 다음 단계 시연 버튼
    function nextNavigationStep() {
        naviStep = (naviStep + 1) % NAVI_STEPS.length;
        const data = NAVI_STEPS[naviStep];
        document.getElementById('navi-arrow').innerText = data.arrow;
        document.getElementById('navi-dist').innerText = data.dist;
        document.getElementById('navi-street').innerText = data.street;
        document.getElementById('navi-remain').innerText = data.remain;
        document.getElementById('navi-bar').style.width = data.progress;
        document.getElementById('current-cctv-name').innerText = data.cctv;
    }

    function triggerSOS() {
